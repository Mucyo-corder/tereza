services:
  - type: web
    name: dukunde-kiliziya-backend
    env: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && node server.js
    envVars:
      - key: DATABASE_URL
        sync: false

  - type: web
    name: dukunde-kiliziya-frontend
    env: node
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm start
    envVars:
      - key: VITE_API_URL
        value: https://dukunde-kiliziya-backend.onrender.com
